<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | CustomPC.tech</title>
  <meta name="description" content="Sign in to track your CustomPC.tech build requests." />
  <meta name="theme-color" content="#101012" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="frontend/site.css" />
  <link rel="stylesheet" href="frontend/navbar.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="lead">Track your build requests and updates.</p>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input id="pass" type="password" required autocomplete="current-password" />
        </div>
        <div class="err-text" id="err" role="alert"></div>
        <button class="btn btn--block" type="submit">Sign in</button>
        <button class="auth-link" type="button" id="reset">Forgot password?</button>
      </form>
      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="frontend/firebase-app.js"></script>
  <script src="frontend/navbar.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      const dest = next && /^[a-z0-9\-]+\.html([?#].*)?$/i.test(next) ? next : 'account.html';
      const form = document.getElementById('login-form');
      const err = document.getElementById('err');
      const btn = form.querySelector('button[type="submit"]');

      if (params.get('signout')) {
        CPC.signOut().then(() => { location.replace('index.html'); });
        return;
      }

      const messages = {
        'auth/invalid-login-credentials': 'Email or password is wrong.',
        'auth/invalid-credential': 'Email or password is wrong.',
        'auth/wrong-password': 'Email or password is wrong.',
        'auth/user-not-found': 'Email or password is wrong.',
        'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
        'auth/invalid-email': 'That email address is not valid.'
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        if (!form.checkValidity()) { form.reportValidity(); return; }
        btn.disabled = true;
        try {
          await CPC.auth.signInWithEmailAndPassword(
            document.getElementById('email').value.trim(),
            document.getElementById('pass').value
          );
          location.href = dest;
        } catch (e) {
          err.textContent = messages[e.code] || e.message || 'Sign in failed.';
          btn.disabled = false;
        }
      });

      document.getElementById('reset').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        err.textContent = '';
        if (!email) { err.textContent = 'Enter your email above, then tap Forgot password.'; return; }
        try {
          await CPC.auth.sendPasswordResetEmail(email);
        } catch (e) {}
        err.style.color = 'var(--ok)';
        err.textContent = 'If that email has an account, a reset link is on its way.';
      });
    })();
  </script>
</body>
</html>
